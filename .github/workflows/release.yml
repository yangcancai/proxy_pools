name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o "proxy_pools_linux_${{ matrix.arch }}" ./cmd/proxy-pools
      - name: Checksums
        run: sha256sum "proxy_pools_linux_${{ matrix.arch }}" > "proxy_pools_linux_${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-pools-linux-${{ matrix.arch }}
          path: |
            proxy_pools_linux_${{ matrix.arch }}
            proxy_pools_linux_${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
